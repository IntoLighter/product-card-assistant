[project]
name = "product-card-assistant"
version = "0.1.0"
description = "AI-помощник для подготовки товарных карточек КИП (локальная LLM через vLLM, веб-интерфейс на Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
product-cards = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# Пакет app ставится в окружение (editable), поэтому `import app...`
# работает одинаково из Streamlit, CLI, тестов и Docker
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

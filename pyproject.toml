# Проект ставится в своё окружение (uv sync, режим редактирования),
# поэтому пакет app импортируется при любом способе запуска
[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.16,<0.10" ]

[project]
name = "product-card-assistant"
version = "0.1.0"
description = "AI-помощник для подготовки товарных карточек КИП (локальная LLM через vLLM, веб-интерфейс на Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "streamlit>=1.66.1",
]

# Консольный режим: uv run product-cards examples/input/*.json
[project.scripts]
product-cards = "app.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pyproject-fmt>=2.30.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "rumdl>=0.3.2",
    "ty>=0.0.96",
]

[tool.uv.build-backend]
# Пакет — папка app в корне проекта, а не src/<имя проекта>
module-name = "app"
module-root = ""

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = [ "T201" ]
"tests/**" = [ "ANN", "ARG", "D", "PLR2004", "S101" ]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "ANN401",
    "COM812",
    # Copyright-заголовки в файлах не нужны: лицензия в LICENSE
    "CPY001",
    "D1",
    "D200",
    "D202",
    "D203",
    "D212",
    # Тексты исключений — готовые сообщения для пользователя на русском,
    # вынос их в переменные или классы только ухудшит читаемость
    "EM101",
    "EM102",
    "RET504",
    "RUF001",
    "RUF002",
    "RUF003",
    # Импорты для аннотаций держим обычными, без блоков TYPE_CHECKING: проще читать,
    # а циклических импортов в проекте нет
    "TC",
    "TRY003",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib" ]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.rumdl]
disable = [ "MD013" ]

# Пакет app ставится в окружение (editable), поэтому `import app...`
# работает одинаково из Streamlit, CLI, тестов и Docker
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "product-card-assistant"
version = "0.1.0"
description = "AI-помощник для подготовки товарных карточек КИП (локальная LLM через vLLM, веб-интерфейс на Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
product-cards = "app.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pyproject-fmt>=2.30.3",
    "pytest>=9.2.0",
    "ruff>=0.15.20",
    "rumdl>=0.3.2",
    "ty>=0.0.96",
]

[tool.hatch.build.targets.wheel]
packages = [ "app" ]

[tool.ruff]
# Русские тексты сообщений и промптов не переносятся форматтером: 88 символов мало
line-length = 120

[tool.ruff.lint.per-file-ignores]
# CLI печатает результат в консоль намеренно
"app/cli.py" = [ "T201" ]
"tests/**" = [ "ANN", "ARG", "D", "PLR2004", "S101" ]

[tool.ruff.lint.flake8-type-checking]
# Аннотации pydantic-моделей нужны в рантайме: их импорты нельзя прятать в TYPE_CHECKING
runtime-evaluated-base-classes = [ "pydantic.BaseModel" ]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "ANN401",
    "COM812",
    # Copyright-заголовки в файлах тестового проекта не нужны
    "CPY001",
    "D1",
    "D200",
    "D202",
    "D203",
    "D212",
    # Тексты исключений — готовые сообщения для пользователя на русском,
    # вынос их в переменные или классы только ухудшит читаемость
    "EM101",
    "EM102",
    "RET504",
    "RUF001",
    "RUF002",
    "RUF003",
    "TRY003",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.rumdl]
disable = [ "MD013" ]

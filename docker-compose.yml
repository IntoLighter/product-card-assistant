name: product-card-assistant

# Значения переменных — из .env (compose читает его сам), секреты — из .env_secrets
x-env-files: &env-files
  - path: .env
  - path: .env_secrets
    required: false

services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG}
    command: >-
      --model=${VLLM_MODEL}
      --served-model-name=${LLM_MODEL}
      --max-model-len=${VLLM_MAX_MODEL_LEN}
      --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION}
      --max-num-seqs=${VLLM_MAX_NUM_SEQS}
      --reasoning-parser=qwen3
      --language-model-only
      ${VLLM_EXTRA_ARGS}
    env_file: *env-files
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 2gb
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    restart: unless-stopped

  app:
    build: .
    env_file: *env-files
    environment:
      # Адрес vLLM внутри сети Docker (в .env — адрес для запуска вне Docker)
      - LLM_BASE_URL=http://vllm:8000/v1
    volumes:
      - ./app:/srv/app
      - ./resources:/srv/resources
    ports:
      - "80:8501"
    depends_on:
      - vllm
    restart: unless-stopped

volumes:
  hf-cache:

name: product-card-assistant

services:
  vllm:
    image: vllm/vllm-openai:v0.28.0
    command: >-
      --model=${VLLM_MODEL}
      --served-model-name=${LLM_MODEL}
      --max-model-len=${VLLM_MAX_MODEL_LEN}
      --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION}
      --max-num-seqs=${VLLM_MAX_NUM_SEQS}
      --reasoning-parser=qwen3
      --language-model-only
      ${VLLM_EXTRA_ARGS}
    environment:
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: 2gb
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      # Адрес vLLM внутри сети Docker (в .env — адрес для запуска вне Docker)
      - LLM_BASE_URL=http://vllm:8000/v1
    volumes:
      - ./app:/srv/app
      - ./resources:/srv/resources
    ports:
      - "80:8501"
    depends_on:
      - vllm
    restart: unless-stopped

volumes:
  hf-cache:

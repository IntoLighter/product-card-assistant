services:
  vllm:
    restart: no

  app:
    restart: no
    command: >-
      sh -c "uv pip install --quiet debugpy
      && exec python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678
      -m streamlit run app/ui.py"
    volumes:
    - ./app:/srv/app
    - ./resources:/srv/resources
    ports:
      - "5678:5678"
